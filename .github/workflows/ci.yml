name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential libsdl2-dev pkg-config
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install sdl2 pkg-config
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-pkgconf make
      - name: Build and test
        if: runner.os != 'Windows'
        run: make test test-sdl sanitize headless debug release && build/headless/velot8-headless --demo
      - name: Build and test (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test test-sdl sanitize headless debug release && build/headless/velot8-headless --demo
